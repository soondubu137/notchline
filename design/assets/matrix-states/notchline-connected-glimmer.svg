<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800"
     role="img" aria-label="Notchline Connected state matrix - Glimmer">
  <title>Notchline — Connected — Glimmer</title>
  <desc>4x4 state matrix, 60 frames at 30fps (2000ms loop). A soft highlight drifts over the mark on a 1:2 Lissajous figure; alpha is 0.15 + 0.65 of a Gaussian 1.25 cells wide, so the floor is 0.15 and the highlight peaks at 0.8. The loop is drawn here repeating; on the surface the mark plays it once per opening of the panel. Ink #D97757 over #21120D.</desc>
  <defs>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12.65" result="b"/>
      <feComponentTransfer in="b" result="halo">
        <feFuncA type="linear" slope="0.55"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="halo"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
