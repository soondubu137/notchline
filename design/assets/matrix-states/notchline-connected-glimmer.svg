<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800"
     role="img" aria-label="Notchline Connected state matrix - Glimmer">
  <title>Notchline — Connected — Glimmer</title>
  <desc>4x4 state matrix, 120 frames at 30fps (4000ms loop). A soft highlight drifts over the mark on a 1:2 Lissajous figure; alpha is 0.15 + 0.65 of a Gaussian 1.25 cells wide, so the floor is 0.15 and the highlight peaks at 0.8. The loop is drawn here repeating; on the surface the mark plays it once per opening of the panel. Ink #D97757 over #21120D.</desc>
